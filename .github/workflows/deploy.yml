# Deploys to Render on every push to main, and PROVES it went live.
#
# Render's own auto deploy stopped on 17 August 2026 and said nothing. Six commits went
# to GitHub and none of them reached the officers, including the fix for the bug that
# had killed the web dashboard. A service that stops deploying keeps serving the last
# good build, so there is no symptom to notice.
#
# This replaces that trigger with one that reports. It fires Render's deploy hook, then
# watches the live file until it actually changes, and FAILS the run if it does not. A
# red mark on the commit is the signal that was missing.
#
# One time setup, by William:
#   Render -> stone-square-sign -> Settings -> Deploy Hook -> copy the URL
#   GitHub -> this repo -> Settings -> Secrets and variables -> Actions -> New secret
#     name:  RENDER_DEPLOY_HOOK
#     value: the URL
# Nobody but GitHub and Render ever sees it.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The secrets context is not allowed in a step condition, so read it as an
      # environment variable and check it in the shell.
      - name: Refuse to deploy without the hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::error::RENDER_DEPLOY_HOOK is not set, so this commit will NOT reach the officers."
            echo "Render, stone-square-sign, Settings, Deploy Hook. Then add it here as a repository secret."
            exit 1
          fi

      - name: Start the build
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::Render refused the deploy hook, HTTP $code. The hook is probably stale."
            exit 1
          fi

      # Waiting for the file to CHANGE is wrong: redeploying the same code changes
      # nothing and would report a false failure. The real question is whether what the
      # officers are served matches the commit being deployed, which is true either way.
      - name: Wait until the officers are served this commit
        run: |
          want=$(sha256sum public/app.js | cut -c1-16)
          for i in $(seq 1 40); do
            live=$(curl -sS --max-time 60 https://stone-square-sign.onrender.com/app.js | sha256sum | cut -c1-16)
            if [ "$live" = "$want" ]; then
              echo "Serving this commit after about $((i * 30)) seconds."
              exit 0
            fi
            sleep 30
          done
          echo "::error::Twenty minutes on and the officers are still not being served this commit. Check the Render build log."
          exit 1
