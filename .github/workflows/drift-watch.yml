# Verify production after deployment, never concurrently with the push that starts it.
# The daily check remains independent so an undeployed or rolled-back release is visible.
name: Is production actually current

on:
  schedule:
    - cron: '15 11 * * *'
  workflow_run:
    workflows: [Deploy]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-drift
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Choose the current deployment
        id: target
        env:
          TRIGGER_COMMIT: ${{ github.event.workflow_run.head_sha }}
        run: |
          current=$(git rev-parse HEAD)
          if [ -n "$TRIGGER_COMMIT" ] && [ "$TRIGGER_COMMIT" != "$current" ]; then
            echo "A newer commit has its own deployment check."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the deployed server and every dashboard module
        if: steps.target.outputs.current == 'true'
        # Scheduled/manual checks also allow an in-flight deployment to settle.
        run: node scripts/check-production.mjs --wait-ms=1200000 --track-main
