# Monitors the hosted dashboard without relying on William's Mac.
#
# During normal Lodge hours the ten minute checks also keep Render responsive. Overnight,
# a thirty minute check lets the free service sleep between checks while still providing
# regular hosted monitoring and leaves headroom in Render's monthly free allowance.
#
# A failed process check triggers one restart of the current production release. A healthy
# process with an unavailable database is reported without redeploying, because restarting
# the web process cannot repair an upstream database outage.

name: Monitor and recover production

on:
  schedule:
    # 6am to midnight Eastern Daylight Time: process-only checks between hourly runs.
    - cron: "17,27,37,47,57 10-23,0-3 * * *"
    # Midnight to 6am Eastern Daylight Time: one process-only check between hourly runs.
    - cron: "37 4-9 * * *"
    # The scheduled event, rather than its delayed runner start time, selects readiness.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the dashboard and recover a stopped web process
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          MONITOR_SCHEDULE: ${{ github.event.schedule }}
          MONITOR_EVENT: ${{ github.event_name }}
        run: |
          BASE="https://stone-square-sign.onrender.com"
          check() {
            curl -fsS --max-time 90 "$BASE/api/health" -o /tmp/health
          }

          healthy=false
          for attempt in 1 2 3; do
            if check; then
              echo "Web process healthy on attempt $attempt: $(cat /tmp/health)"
              healthy=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 20; fi
          done

          if [ "$healthy" != "true" ]; then
            if [ -z "$HOOK" ]; then
              echo "::error::The dashboard web process is unavailable and RENDER_DEPLOY_HOOK is not configured for automatic recovery."
              exit 1
            fi
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST "$HOOK")
            if [ "$code" != "200" ] && [ "$code" != "201" ] && [ "$code" != "202" ]; then
              echo "::error::The dashboard was unavailable and Render refused the recovery request with HTTP $code."
              exit 1
            fi
            echo "Render accepted the automatic recovery request."
            for attempt in $(seq 1 16); do
              sleep 30
              if check; then
                echo "The dashboard recovered after the production restart: $(cat /tmp/health)"
                healthy=true
                break
              fi
              if [ "$attempt" -eq 16 ]; then
                echo "::error::The dashboard did not recover within eight minutes."
                exit 1
              fi
            done
          fi

          # An hourly event still checks readiness if GitHub starts it late. Manual
          # runs also check it; frequent process-only events do not wake the database.
          if [ "$MONITOR_SCHEDULE" != "7 * * * *" ] && [ "$MONITOR_EVENT" != "workflow_dispatch" ]; then
            echo "Web process check complete. The hourly database readiness check is not due on this run."
            exit 0
          fi
          ready=$(curl -s -o /tmp/ready -w '%{http_code}' --max-time 90 "$BASE/api/ready" || echo 000)
          if [ "$ready" != "200" ]; then
            echo "::error::The web process is running, but a required service is unavailable. Readiness returned HTTP $ready: $(cat /tmp/ready 2>/dev/null || true)"
            exit 1
          fi
          echo "Dashboard and database are ready: $(cat /tmp/ready)"

  coverage:
    needs: monitor
    if: always() && (github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect overdue or disabled regular checks without touching Lodge records
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-monitor-freshness.mjs
