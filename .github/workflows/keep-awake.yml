# Keeps the app awake during the hours officers actually use it.
#
# A free Render web service sleeps after 15 minutes idle and takes roughly 50 seconds
# to wake, which is a poor first impression when the Secretary taps a link. This pings
# the health endpoint often enough that it never sleeps while anyone is likely to open
# it, and lets it sleep overnight.
#
# The hours are deliberate, not lazy. Render allows 750 instance hours a month per
# workspace and a 31 day month is 744, so keeping it awake around the clock would eat
# nearly the entire allowance and leave nothing for any other service. 6am to midnight
# Eastern is about 558 hours a month, which leaves real headroom.
#
# Note this is best effort. GitHub delays or drops scheduled runs when it is busy, and
# it disables schedules on a repository with no commits for 60 days. If the app feels
# slow again, check here first.

name: Keep awake

on:
  schedule:
    # Every 10 minutes, 10:00 to 03:59 UTC, which is 6am to just before midnight
    # Eastern Daylight Time. Cron here is always UTC; it does not follow the clocks.
    - cron: "*/10 10-23,0-3 * * *"
  workflow_dispatch:        # so it can be run by hand to warm the app before a meeting

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake the dashboard
        run: |
          URL="https://stone-square-sign.onrender.com/api/health"
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 90 "$URL" || echo "000")
            if [ "$code" = "200" ]; then
              echo "awake on attempt $attempt: $(cat /tmp/body)"
              exit 0
            fi
            echo "attempt $attempt returned $code, waiting for the instance to boot"
            sleep 20
          done
          # A failure here means the app is down, not merely asleep. Fail loudly so it
          # shows up in the Actions tab rather than passing quietly.
          echo "health check never returned 200"
          exit 1
