# This Blueprint describes the existing paid Starter web service. Its automatic
# sync is paused in Render; the GitHub deployment workflow runs the private
# rehearsal before calling Render's deploy hook. Do not resume Blueprint sync
# until the proposed configuration has been reviewed against the live service.
# Documents live in Postgres rather than on the service filesystem.
# DATABASE_URL is the pooled Neon connection string configured in Render.

services:
  - type: web
    name: stone-square-sign
    runtime: node
    plan: starter
    region: ohio
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    # Process-only liveness check. It must never query Neon, because Render calls it
    # frequently and those checks otherwise consume database compute while nobody uses it.
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"

      # Neon pooled connection string. Required. Without it the app falls back to
      # in-process storage and a free instance loses every signed document on restart.
      - key: DATABASE_URL
        sync: false

      # Optional Luna connection. Enter the value only in Render Environment.
      # The application enforces a shared $5 monthly generation allowance.
      - key: OPENAI_API_KEY
        sync: false

      # The public address officers reach, used to build invitation links.
      - key: APP_BASE_URL
        sync: false

      # Only this address may claim the owner account.
      - key: OWNER_EMAIL
        sync: false

      # The Senior and Junior Warden, comma separated. These are the only two addresses
      # that may hold the warden seat. They live here rather than in the source because
      # this repository is public and a Brother's personal address is his own. Unset
      # means nobody can hold the seat, which is the safe way to fail.
      - key: WARDEN_EMAILS
        sync: false

      # Namecheap Private Email is configured in Render. Preserve the existing
      # host, port, and TLS settings instead of overwriting them on Blueprint sync.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false

      # Candidate Tracker single sign on. The shared secret must be the SAME value the
      # Tracker already runs with; rotating one side alone breaks SSO for every officer.
      - key: CANDIDATE_TRACKER_URL
        sync: false
      - key: TRACKER_SSO_SHARED_SECRET
        sync: false

      # Dues. Read-only Zeffy access, reconciled against the roster in the database.
      # Visible to the Worshipful Master and the Secretaries only.
      - key: ZEFFY_API_KEY
        sync: false
      - key: ZEFFY_DUES_CAMPAIGN_ID
        sync: false
      - key: ZEFFY_CUSTOM_DUES_CAMPAIGN_ID
        sync: false
      # Last year's custom campaign. Set so its payments can be reported as stale
      # rather than silently counted toward this year.
      - key: ZEFFY_STALE_CAMPAIGN_ID
        sync: false
      - key: DUES_RATE_CENTS
        value: "17500"
      - key: DUES_YEAR
        value: "2026-2027"

      # Sign-in lifetime is fixed at 90 days by the application.
      - key: MAX_UPLOAD_BYTES
        value: "12582912"
